version: v2

# Learn more about managed mode, see https://buf.build/docs/generate/managed-mode

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/mfridman/protoc-gen-go-json/examples/gen/go

# Both plugins build from source, so the generated code always matches the
# versions in go.mod. In your own project, you can use the remote plugins
# buf.build/protocolbuffers/go and buf.build/community/mfridman-go-json.
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt:
      - paths=source_relative
      - default_api_level=API_HYBRID
  - local: ["go", "run", "github.com/mfridman/protoc-gen-go-json"]
    out: gen/go
    opt:
      - paths=source_relative
      - orig_name=true

clean: true
